services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Your_strong_Password123
    ports: ["1433:1433"]
    volumes: [sql-data:/var/opt/mssql]
  api:
    build:
      context: ..
      dockerfile: src/CallCenter.API/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CallCenter: Server=sqlserver,1433;Database=CallCenter;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True
    ports: ["8080:8080"]
    depends_on: [sqlserver]
volumes:
  sql-data:
